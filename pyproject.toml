[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-smartflow-core"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn[standard]", "pydantic>=2.8", "pydantic-settings",
    "httpx", "pyyaml", "pypdf>=6,<7", "tzdata; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff", "mypy", "types-PyYAML"]

[tool.setuptools.packages.find]
include = ["core", "core.*", "modules", "modules.*"]

[tool.setuptools.package-data]
core = ["schema.sql"]
"modules.s1_kyc" = ["prompts/*.yaml"]

[tool.ruff]
target-version = "py311"
line-length = 100
cache-dir = "D:/cache/ai-smartflow-core/ruff"

[tool.mypy]
python_version = "3.11"
strict = true
cache_dir = "D:/cache/ai-smartflow-core/mypy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = "D:/cache/ai-smartflow-core/pytest"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
