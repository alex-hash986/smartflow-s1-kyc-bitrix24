name: ai-smartflow-core

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.48.5}
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      N8N_HOST: "127.0.0.1"
      N8N_LISTEN_ADDRESS: "0.0.0.0"
      N8N_PORT: "5678"
      N8N_EDITOR_BASE_URL: "http://127.0.0.1:5678"
      WEBHOOK_URL: "http://127.0.0.1:5678/"
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
    volumes:
      - type: bind
        source: "${SMARTFLOW_N8N_DATA:-D:/ai-smartflow/n8n/.n8n}"
        target: /home/node/.n8n
      - ../workflows:/workflows:ro
